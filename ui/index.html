<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart-Four</title>
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <h1>Smart-Four</h1>
        <div id="status" class="status">—</div>
      </header>
      <div id="scene-container"></div>
      <aside id="panel">
        <section class="panel-section">
          <h2>Actions</h2>
          <div class="btn-row">
            <button id="revert-btn" disabled>Revert</button>
            <button id="play-btn" hidden>Play</button>
            <button id="reset-btn" class="danger">Reset</button>
          </div>
        </section>
        <section class="panel-section">
          <h2>Game setup <span class="hint">(takes effect immediately)</span></h2>
          <div class="field">
            <span>White player</span>
            <label class="radio-row"><input type="radio" name="white-kind" value="human" checked /><span>Human</span></label>
            <label class="radio-row"><input type="radio" name="white-kind" value="model" /><span>Model</span></label>
            <select id="white-checkpoint" disabled></select>
          </div>
          <div class="field">
            <span>Black player</span>
            <label class="radio-row"><input type="radio" name="black-kind" value="human" /><span>Human</span></label>
            <label class="radio-row"><input type="radio" name="black-kind" value="model" checked /><span>Model</span></label>
            <select id="black-checkpoint" disabled></select>
          </div>
          <div class="field" id="effort-field">
            <span id="effort-label">Think effort</span>
            <label class="radio-row"><input type="radio" name="effort" value="0" /><span>Instant</span></label>
            <label class="radio-row"><input type="radio" name="effort" value="1000" checked /><span>Medium</span></label>
            <label class="radio-row"><input type="radio" name="effort" value="2500" /><span>High</span></label>
            <label class="radio-row"><input type="radio" name="effort" value="5000" /><span>Ultra</span></label>
          </div>
        </section>
      </aside>
      <footer id="hintbar">Click a column to place a piece &middot; drag to rotate &middot; scroll to zoom</footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
