<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart-Four</title>
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <h1>Smart-Four</h1>
        <div id="status" class="status">—</div>
      </header>
      <div id="scene-container"></div>
      <aside id="panel">
        <section class="panel-section">
          <h2>Actions</h2>
          <div class="btn-row">
            <button id="revert-btn" disabled>Revert</button>
            <button id="new-game-btn">New Game</button>
          </div>
        </section>
        <section class="panel-section">
          <h2>Game setup <span class="hint">(takes effect immediately)</span></h2>
          <div class="field">
            <span>Opponent</span>
            <label class="radio-row"><input type="radio" name="mode" value="machine" checked /><span>Machine</span></label>
            <label class="radio-row"><input type="radio" name="mode" value="person" /><span>Person</span></label>
          </div>
          <div class="field" id="color-field">
            <span>You play</span>
            <label class="radio-row"><input type="radio" name="color" value="white" checked /><span>White (first)</span></label>
            <label class="radio-row"><input type="radio" name="color" value="black" /><span>Black</span></label>
          </div>
          <label class="field">
            <span>Think effort <span id="effort-value">2000</span></span>
            <input type="range" id="effort-range" min="0" max="2000" step="500" value="2000" />
          </label>
        </section>
      </aside>
      <footer id="hintbar">Click a column to place a piece &middot; drag to rotate &middot; scroll to zoom</footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
