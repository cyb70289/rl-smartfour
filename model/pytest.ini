[pytest]
# The worker-function tests fork probe processes to avoid the ~3s torch
# re-import per spawn. torch is single-threaded here (CPU), so Python 3.12's
# generic multi-threaded-fork caution does not apply to those children.
filterwarnings =
    ignore:This process \(pid=.*\) is multi-threaded, use of fork\(\) may lead to deadlocks in the child.*:DeprecationWarning
